<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>North Vault | Checkout</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">

    <a href="index.html" class="logo">
        NORTH <span>VAULT</span>
    </a>

    <nav>
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="services.html">Services</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>

    <div class="header-actions">

        <a href="cart.html">
            🛒 <span id="cartCount">0</span>
        </a>

        <a href="profile.html">
            👤
        </a>

    </div>

</header>


<main class="page">

    <div class="page-heading">

        <p class="eyebrow">
            NORTH VAULT
        </p>

        <h1>
            Checkout
        </h1>

    </div>


    <div class="checkout-layout">


        <!-- =========================
             DELIVERY INFORMATION
        ========================== -->

        <div class="card">

            <h2>
                Delivery Information
            </h2>


            <form
                id="checkoutForm"
                action="create_payment.php"
                method="POST"
            >


                <input
                    type="text"
                    id="checkoutName"
                    name="name"
                    placeholder="Full Name"
                    required
                >


                <input
                    type="email"
                    id="checkoutEmail"
                    name="email"
                    placeholder="Email Address"
                    required
                >


                <input
                    type="tel"
                    id="checkoutPhone"
                    name="phone"
                    placeholder="Phone Number"
                    required
                >


                <input
                    type="text"
                    id="checkoutAddress"
                    name="address"
                    placeholder="Delivery Address"
                    required
                >


                <input
                    type="text"
                    id="checkoutCity"
                    name="city"
                    placeholder="City"
                    required
                >


                <select
                    id="paymentMethod"
                    name="paymentMethod"
                    required
                >

                    <option value="">
                        Select Payment Method
                    </option>

                    <option value="Flutterwave">
                        Pay with Flutterwave
                    </option>

                </select>


                <!--
                    JavaScript will put the correct
                    cart total here.
                -->

                <input
                    type="hidden"
                    id="paymentAmount"
                    name="amount"
                    value="0"
                >


                <button
                    class="btn"
                    type="submit"
                >
                    Pay with Flutterwave
                </button>


            </form>

        </div>



        <!-- =========================
             ORDER SUMMARY
        ========================== -->

        <div class="card">

            <h2>
                Order Summary
            </h2>


            <div id="checkoutSummary"></div>

        </div>


    </div>

</main>


<script src="script.js"></script>

</body>
</html>
